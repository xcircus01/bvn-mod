name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: |
          set -e
          unzip -q -o "$(ls greenfield-game*.zip | head -n 1)" -d _project
          S=$(find _project -maxdepth 3 -name settings.gradle | head -n 1)
          echo "PROJECT_DIR=$(dirname "$S")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        run: |
          SM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -n 1)
          yes | $SM --licenses > /dev/null || true
          $SM "platforms;android-34" "build-tools;34.0.0"

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
